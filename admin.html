<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — dzbanek-bot</title>
    <meta
      name="description"
      content="Configure dzbanek-bot channels for news, Steam deals, and Epic free games via Discord login."
    />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/bot-avatar.png" type="image/png" />
    <!--
      The admin dashboard is served by the bot itself, on the bot's own origin.

      It used to be duplicated here. Two copies of a 65 KB page inevitably drift:
      when the bot switched its OAuth hand-off from `?session=<token>` in the URL
      to a single-use `?code=`, this copy still looked for `?session=`, silently
      discarded every login and showed "Could not reach the admin API".

      Serving admin from the bot origin also makes it same-origin, so it needs no
      CORS and no cross-origin token hand-off at all. This page is only a
      forwarder, so every existing `href="admin.html"` and old bookmark keeps
      working. The destination comes from js/config.js (DZBANEK.API_BASE), so the
      bot's URL is still configured in exactly one place.
    -->
    <script src="js/config.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1a1b1e;
        color: #f2f3f5;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      a {
        color: #5865f2;
      }
      .muted {
        color: #949ba4;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Opening the admin dashboard…</p>
      <p class="muted">
        If nothing happens, <a id="manual" href="https://macmini-bot.tail63f4a.ts.net/admin.html">open it here</a>.
      </p>
    </main>

    <script>
      (function () {
        var FALLBACK = 'https://macmini-bot.tail63f4a.ts.net';

        function apiBase() {
          try {
            var d = window.DZBANEK;
            if (d && typeof d.refreshApiBase === 'function') {
              var refreshed = String(d.refreshApiBase() || '');
              if (refreshed) return refreshed;
            }
            if (d && (d.API_BASE || d.PRODUCTION_API_BASE)) {
              return String(d.API_BASE || d.PRODUCTION_API_BASE);
            }
          } catch (err) {
            /* fall through to the hard-coded default */
          }
          return FALLBACK;
        }

        var base = apiBase().replace(/\/+$/, '') || FALLBACK;
        // Carry the query string and hash through, so links that deep-link into
        // the dashboard (or carry an OAuth hand-off code) still land correctly.
        var target = base + '/admin.html' + window.location.search + window.location.hash;

        var manual = document.getElementById('manual');
        if (manual) manual.href = target;

        // Never redirect to ourselves. If this forwarder is ever served from the
        // bot's own origin, redirecting would loop forever; show the link instead.
        var here = window.location.origin + window.location.pathname;
        if (target.split('?')[0].split('#')[0] === here) {
          document.querySelector('main').innerHTML =
            '<p>The admin dashboard should be served by the bot at this address.</p>';
          return;
        }

        // replace() so Back does not bounce the visitor straight back here.
        window.location.replace(target);
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://macmini-bot.tail63f4a.ts.net/admin.html" />
    </noscript>
  </body>
</html>
