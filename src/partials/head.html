<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="theme-color" content="#120c08" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme: light)" />
  {{canonical}}
  <meta property="og:site_name" content="Dzbanek" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="{{ogImage}}" />
  <meta property="og:image:width" content="1280" />
  <meta property="og:image:height" content="720" />
  <meta property="og:image:alt" content="A ceramic pitcher, chocolate chip cookies, and a steaming mug on a wooden kitchen counter at night." />
  {{video}}
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="{{ogImage}}" />
  <link rel="icon" href="assets/dzbanek.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/kitchen-square.jpg" />
  <link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/site.css" />
</head>
