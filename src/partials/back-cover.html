<!-- The back cover, framed like a cloth binding: the invite at the end of a page. -->
<section class="cta" data-reveal>
  <div class="cta-photo" aria-hidden="true">
    <picture>
      <source type="image/webp" srcset="assets/avatar-large.webp" />
      <img src="assets/avatar-large.jpg" alt="" width="435" height="435" loading="lazy" decoding="async" />
    </picture>
  </div>
  <div class="cta-copy">
    <h2 data-i18n="cta.title">Want it on your server?</h2>
    <p class="lead" data-i18n="cta.body">Invite the public bot, or grab the code on GitHub and run your own.</p>
    <div class="hero-actions">
      <a class="btn btn-clay btn-lg" href="{{invite}}" data-invite target="_blank" rel="noopener noreferrer" data-i18n="nav.invite">Add to Server</a>
      <a class="btn btn-ghost btn-lg" href="{{github}}" target="_blank" rel="noopener noreferrer"><svg width="18" height="18" aria-hidden="true"><use href="#i-github" /></svg> GitHub</a>
    </div>
  </div>
</section>
